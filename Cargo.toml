[package]
name = "entytd"
version = "0.3.0"
edition = "2024"

[dependencies]
bevy_common_assets = { version = "0.17.0", features = ["ron"] }
bevy_pipelines_ready = "0.9.0"
rand = { version = "0.10.3", default-features = false, features = [
    "std",
    "thread_rng",
] }
image = { version = "0.25", default-features = false }
pathfinding = "4.16"
serde = "1"
ron = "0.12"
strum = "0.28"
strum_macros = "0.28"
grid = "1.0"
thiserror = "2.0"
bevy_simple_prefs = "0.9.0"

[features]
inspector = ["bevy-inspector-egui", "bevy/bevy_mikktspace"]
recording = []

[dependencies.bevy]
version = "0.19"
default-features = false
features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_log",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_winit",
    "bevy_window",
    "default_font",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "vorbis",
    "webgl2",
    "x11",
    "wayland",
    "zstd_rust",
]

[dependencies.bevy-inspector-egui]
version = "0.37.0"
default-features = false
features = ["bevy_render"]
optional = true

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
manual_let_else = "warn"
redundant_else = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
map_flatten = "warn"

# Dependencies for WASM only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console", "Window", "Storage"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
